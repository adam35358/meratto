[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route /api/* requests to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA fallback for React Client-Side Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
