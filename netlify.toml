[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  SECRETS_SCAN_ENABLED = "false"

[functions]
  external_node_modules = ["@netlify/blobs"]

# Route /api/* requests to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Google Search Console verification file
[[redirects]]
  from = "/google15dfa24e4334f6c8.html"
  to = "/google15dfa24e4334f6c8.html"
  status = 200

# SPA fallback for React Client-Side Routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
